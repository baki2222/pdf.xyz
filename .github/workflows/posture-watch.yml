# Watch the deployed operations posture and email the owner when it degrades.
#
# GitHub emails the repository owner when a SCHEDULED workflow fails, and it
# arrives in a channel a human already reads. That alarm lives inside the
# scheduler it depends on, so it cannot report the scheduler not running —
# which it did not, for most of 2026-11-01 (see below). The last step pings an
# OUTSIDE dead-man's switch (healthchecks.io, owner's choice 2026-11-02), which
# emails when a run fails OR when no run arrives in time.
#
# All of the logic lives in the scripts this runs — every
# scripts/check-*.mjs, one step each (src/deploy/public-surface-watch.test.ts
# fails if one is missing, or if a step after the first can be skipped by an
# earlier failure) — including why each reads already-computed verdicts rather
# than re-deriving one here. Keeping it out of YAML is deliberate: a `jq` condition
# in a shell step is a verdict rule in a second place, and it drifts.
name: posture-watch

on:
  schedule:
    # Three times an hour, off the hour. WAS hourly ("17 * * * *"), on the
    # premise that a tighter schedule buys nothing and burns Actions minutes.
    # Both stopped holding: the repository is public (standard runners cost
    # nothing), and GitHub's scheduler ran this 24 of 24 times on 2026-10-30
    # and 2026-10-31 but 8 of 37 from 2026-11-01 00:00 to 2026-11-02 13:00 UTC,
    # with no CI load to explain it. Scheduled runs are dropped independently,
    # so three tries an hour make an hour with no check much rarer, and the
    # dead-man's switch below says when it happens anyway.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the check is dependency-free and uses node's built-in
      # fetch, so nothing here can fail for a reason unrelated to the posture.
      - name: Check operations posture
        run: node scripts/check-operations-posture.mjs

      # The site itself, not the fleet. The check above reads one JSON payload
      # and answers "is the worker healthy" — truthfully, and about a different
      # question than "does /tools still render". `if: always()` so a red fleet
      # cannot hide a red surface: they fail independently, and a human reading
      # the failure email needs both rows.
      - name: Check public surface
        if: always()
        run: node scripts/check-public-surface.mjs

      # The backup, asked from OUTSIDE Coolify. Its own notifier cannot report
      # the failure mode that matters most — the scheduler simply stopping —
      # because nothing fails when nothing runs. This reads the bucket instead:
      # is there a recent object, large enough to be a real dump? The token is
      # object-read-only on that one bucket, so the watcher cannot damage what
      # it watches.
      - name: Check backup freshness
        if: always()
        env:
          R2_BACKUP_ENDPOINT: ${{ vars.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          R2_BACKUP_KEY_ID: ${{ secrets.R2_BACKUP_KEY_ID }}
          R2_BACKUP_SECRET: ${{ secrets.R2_BACKUP_SECRET }}
        run: node scripts/check-backup-freshness.mjs

      # Last, and whatever happened above: tell the outside switch that this
      # run happened and how it ended (`/fail` unless every step passed).
      # Without the secret it says so and does nothing.
      - name: Ping the dead-man's switch
        if: always()
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ping-dead-mans-switch.mjs
