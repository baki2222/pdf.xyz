name: Publish images

# Pushes the same two Dockerfile targets `container.yml` builds — `web` and
# `worker` — to GHCR, so a deployment PULLS a prebuilt image instead of
# building on the box (the production web host has ONE vCPU; a Next.js build
# there is slow at best and OOM at worst).
#
# This lives in its own workflow on purpose. `container.yml`'s no-secrets /
# never-publishes contract is load-bearing and stated in its header; extending
# it with a push step would quietly break the sentence every reviewer of that
# file relies on. The two workflows share BuildKit cache scopes, so the second
# build of the same commit is mostly cache hits.
#
# Images: ghcr.io/baki2222/pdfxyz-web, ghcr.io/baki2222/pdfxyz-worker —
# tagged `latest` and the commit SHA. The OCI source label links them to this
# repository, which also makes them PRIVATE by inheritance.
#
# Both images are smoked BEFORE the push, at the point of consumption:
# the worker must keep its no-config honesty contract, and the web image must
# actually SERVE — including the CSP header carrying the storage origin the
# build arg exists for. An image that fails either is never published.
#
# After the push, the same run tells Coolify to deploy BOTH tiers and holds
# until the public wire serves the identities of the images it just built —
# merged is shipped, and this run is what proves it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a publish mid-push: a superseded run finishing late only
  # moves `latest` forward again; a canceled run can leave a half-pushed pair.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Smoke + push web and worker images to GHCR
    runs-on: ubuntu-latest
    env:
      WEB_IMAGE: ghcr.io/baki2222/pdfxyz-web
      WORKER_IMAGE: ghcr.io/baki2222/pdfxyz-worker
      # Repository VARIABLE (not a secret — production serves this string in
      # every response's CSP header). Read once here so the guard below and the
      # build arg cannot drift apart.
      STORAGE_CONNECT_SRC: ${{ vars.NEXT_PUBLIC_STORAGE_CONNECT_SRC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's DISK, not the build, is the limit. On 2026-10-09 publish
      # died loading the worker image ("no space left on device") once the
      # worker gained the Carlito/Caladea/Liberation/Noto fonts its Office
      # conversions draw in; the PR's identical build had just fit. Both images
      # are loaded side by side for the smokes, so the toolchains ubuntu-latest
      # preinstalls and no step here uses are removed first.
      # src/deploy/ci-workflow.test.ts requires this before any loaded build.
      # IndexNow (scripts/indexnow-submit.mjs) is told which URLs are NEW or
      # CHANGED, so it needs the sitemap as production served it BEFORE this
      # run deploys anything. Read here, ahead of every build and the deploy,
      # past the edge cache (a unique query string), or the snapshot is
      # whatever Cloudflare held — up to a day old.
      - name: Snapshot the live sitemap before deploying
        if: github.ref == 'refs/heads/main'
        run: curl -fsS "https://pdf.xyz/sitemap.xml?indexnow=before-${GITHUB_RUN_ID}" -o /tmp/sitemap-before.xml

      - name: Free runner disk for two loaded images
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      # Fail LOUDLY before spending build minutes: an empty value would bake a
      # CSP without the storage origin, and nothing else fails until a real
      # visitor's upload is refused by their own browser.
      - name: Refuse to bake a blank storage CSP origin
        run: |
          if [ -z "${STORAGE_CONNECT_SRC}" ]; then
            echo "::error::repository variable NEXT_PUBLIC_STORAGE_CONNECT_SRC is unset; the web image would block browser→storage uploads via its own CSP"
            exit 1
          fi
          echo "baking connect-src extension: ${STORAGE_CONNECT_SRC}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          load: true
          push: false
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_STORAGE_CONNECT_SRC=${{ env.STORAGE_CONNECT_SRC }}
          labels: |
            org.opencontainers.image.source=https://github.com/baki2222/pdf.xyz
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=pdfxyz-web
            type=gha,scope=pdfxyz-worker
          cache-to: type=gha,mode=max,scope=pdfxyz-web

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: true
          push: false
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/baki2222/pdf.xyz
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=pdfxyz-worker
            type=gha,scope=pdfxyz-web
          cache-to: type=gha,mode=max,scope=pdfxyz-worker

      # ---- smoke BEFORE push — an image that fails here is never published ----

      # The worker's headline honesty contract, same as container.yml runs.
      - name: Worker no-config honesty smoke
        run: docker run --rm ${WORKER_IMAGE}:latest pnpm worker:smoke

      # The web image must SERVE, and the served CSP must carry the storage
      # origin the build arg was for. This is the check that can actually fail
      # on "the arg never reached the wire" — asserting the env var was passed
      # cannot.
      - name: Web image serves, and its CSP carries the storage origin
        run: |
          docker run -d --name web-smoke -p 3000:3000 ${WEB_IMAGE}:latest
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/body http://127.0.0.1:3000/ 2>/dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS -D /tmp/headers -o /tmp/body http://127.0.0.1:3000/; then
            echo "::error::web container never answered; its own logs follow"
            echo "---- docker ps -a ----";    docker ps -a
            echo "---- docker logs ----";     docker logs web-smoke 2>&1 | tail -60
            echo "---- docker inspect ----";  docker inspect web-smoke --format "exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}"
            exit 7
          fi
          grep -qi "pdf.xyz" /tmp/body || { echo "::error::homepage body does not mention pdf.xyz"; exit 1; }
          if ! grep -i "content-security-policy" /tmp/headers | grep -q "r2.cloudflarestorage.com"; then
            echo "::error::served CSP is missing the storage origin — the build arg did not reach the wire"
            grep -i "content-security-policy" /tmp/headers || echo "(no CSP header at all)"
            exit 1
          fi
          # public/ must be INSIDE the image: next start serves it from disk,
          # and the image shipped without it until 2026-08-24 (Vercel serves
          # public/ itself, so nothing upstream could notice). dk.txt is a
          # tracked file in public/, so a 404 here means the COPY is gone.
          curl -fsS -o /tmp/dk http://127.0.0.1:3000/dk.txt || { echo "::error::/dk.txt 404 — public/ did not reach the web image"; exit 1; }
          if grep -qi "<!DOCTYPE" /tmp/dk; then echo "::error::/dk.txt served the HTML 404 page, not the file"; exit 1; fi
          docker rm -f web-smoke
          echo "web image serves 200, CSP carries the storage origin, public/ is present"

      # Branch dispatches validate the full pipeline WITHOUT publishing; only
      # main may move the tags a deployment pulls.
      - name: Push both images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${WEB_IMAGE}:latest
          docker push ${WEB_IMAGE}:${{ github.sha }}
          docker push ${WORKER_IMAGE}:latest
          docker push ${WORKER_IMAGE}:${{ github.sha }}

      # ---- deploy: the push above moves :latest; this makes something RUN it ----
      #
      # Restores the property the Vercel exit silently dropped on 2026-08-24:
      # merging to main SHIPS. Between the migration and this step, every
      # deployment was a human clicking Coolify (its queue recorded all of them
      # as is_webhook=false, is_api=false).
      #
      # Two decisions here are load-bearing:
      #
      #   * The worker MUST use `POST /services/{uuid}/restart?latest=true`.
      #     The generic `/deploy` endpoint on a compose Service calls
      #     StartService WITHOUT pullLatestImages, so it answers 200 while
      #     restarting the OLD image — read in the running Coolify 4.3.10
      #     (DeployController.php:571), and the correct endpoint's pull was
      #     verified via a docker `image pull` event on the worker host.
      #     The web Application's `/deploy` DOES pull :latest before recreating.
      #
      #   * A 200 from Coolify means "queued", not "running", so the step holds
      #     until the PUBLIC wire serves identity values read from the images
      #     built above — never from the checkout: the image tree is the
      #     .dockerignore-filtered one and the two fingerprints differ.
      - name: Deploy both tiers via Coolify, and hold until the wire serves THIS build
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::COOLIFY_TOKEN secret is unset — images were pushed but nothing will run them"
            exit 1
          fi

          # Expected identities, read from the artifacts a reader will receive.
          WEB_BUILD_ID=$(docker run --rm ${WEB_IMAGE}:latest cat .next/BUILD_ID)
          cat > /tmp/fp.ts <<'TS'
          import { computeBuildFingerprint } from "./src/lib/workers/build-fingerprint";
          console.log(computeBuildFingerprint());
          TS
          WORKER_FP=$(docker run --rm -v /tmp/fp.ts:/app/fp.ts ${WORKER_IMAGE}:latest node_modules/.bin/tsx fp.ts)
          echo "expecting web BUILD_ID=${WEB_BUILD_ID} worker fingerprint=${WORKER_FP}"
          # A poll for a malformed value would wait ten minutes to report a
          # parse bug as a deploy failure — refuse it up front.
          case "${WEB_BUILD_ID}" in
            *[!A-Za-z0-9_-]*|"") echo "::error::web BUILD_ID did not parse"; exit 1;;
          esac
          if ! echo "${WORKER_FP}" | grep -qE '^[0-9a-f]{12}$'; then
            echo "::error::worker fingerprint did not parse (${WORKER_FP})"
            exit 1
          fi

          # Web (Application): a Coolify redeploy pulls :latest, then recreates.
          curl -fsS -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "https://coolify.pdf.xyz/api/v1/deploy?uuid=7fqm2t0y1yxjf9gkcmado5vn"
          echo ""
          # Worker (Service): the restart endpoint, latest=true — see header.
          curl -fsS -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "https://coolify.pdf.xyz/api/v1/services/r9fkr9muiynnw0rcgbnuh7nn/restart?latest=true"
          echo ""

          # Hold until BOTH tiers serve this run's identities. An unknown
          # BUILD_ID manifest is a 404 (measured in both directions), and the
          # worker heartbeat publishes its image's source fingerprint.
          web_ok=""; worker_ok=""
          for i in $(seq 1 60); do
            if [ -z "${web_ok}" ] && curl -fsS -o /dev/null "https://pdf.xyz/_next/static/${WEB_BUILD_ID}/_buildManifest.js" 2>/dev/null; then
              web_ok=yes; echo "web serves BUILD_ID ${WEB_BUILD_ID} (t=$((i*10))s)"
            fi
            if [ -z "${worker_ok}" ] && curl -fsS "https://pdf.xyz/api/worker/operations" 2>/dev/null | grep -q "Running build ${WORKER_FP}"; then
              worker_ok=yes; echo "worker heartbeat publishes ${WORKER_FP} (t=$((i*10))s)"
            fi
            if [ -n "${web_ok}" ] && [ -n "${worker_ok}" ]; then break; fi
            sleep 10
          done
          if [ -z "${web_ok}" ] || [ -z "${worker_ok}" ]; then
            echo "::error::deploy did not reach the wire in 10 minutes (web=${web_ok:-no} worker=${worker_ok:-no}); the wire currently says:"
            curl -sS "https://pdf.xyz/api/worker/operations" | grep -o "Running build [a-f0-9]*" || true
            exit 1
          fi
          # WAS "both tiers serve the build this run pushed — merged IS shipped".
          # The web half earns that: BUILD_ID is the build's own identity. The
          # worker half does not. Its fingerprint is a hash of the source the
          # IMAGE CARRIES, and the image carries no Dockerfile, no
          # pnpm-lock.yaml and no docker-compose.worker.yml — so a change
          # confined to those is byte-identical to the running image, this hold
          # passes instantly against the OLD one, and the line below would have
          # called it shipped. Not hypothetical: the repo's OCR drift was
          # exactly that shape, tesseract packs in the Dockerfile against a
          # language list in src/.
          #
          # src/lib/workers/build-fingerprint.test.ts now derives the worker
          # stage's COPY list and fails if the image gains anything the
          # fingerprint cannot see, so the residue is bounded and written down
          # rather than silent.
          echo "web serves this build's BUILD_ID; worker publishes this build's source fingerprint"
          echo "note: the worker fingerprint cannot see the Dockerfile, the lockfile or the compose file"

      # Only once the wire serves THIS build: the new pages and the key file
      # must already be live when Bing comes to read them. Best-effort — an
      # IndexNow outage is no reason to call a deploy failed — but loud.
      - name: Tell IndexNow which pages are new or changed
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs --before=/tmp/sitemap-before.xml || { echo "::warning::IndexNow submission failed; see the log above"; exit 1; }
