name: Container images

# Builds the two INDEPENDENT Dockerfile targets — `web` and `worker` — as
# first-class CI checks, and exercises the worker image's no-config honesty
# contract. This is the real Docker build the repo's own build environment cannot
# run (no reachable Docker daemon there); the static tests under `src/deploy/`
# pin the Dockerfile/compose invariants, and this workflow proves the images
# actually build and that the worker stays honest with nothing configured.
#
# Secrets policy — load-bearing: this workflow needs NO secrets and configures no
# provider. Images are built with `push: false` (never published) and the worker
# is smoked with NOTHING wired, so the daemon must refuse to fabricate work.
# Nothing below references a repository secret or names a provider value.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build web + worker images · worker no-config smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's DISK, not the build, is the limit. On 2026-10-09 publish
      # died loading the worker image ("no space left on device") once the
      # worker gained the Carlito/Caladea/Liberation/Noto fonts its Office
      # conversions draw in; the PR's identical build had just fit. Both images
      # are loaded side by side for the smokes, so the toolchains ubuntu-latest
      # preinstalls and no step here uses are removed first.
      # src/deploy/ci-workflow.test.ts requires this before any loaded build.
      - name: Free runner disk for two loaded images
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the web target only (the Next.js site). Loaded into the local image
      # store so the separation checks below can run it. Never pushed.
      - name: Build web image target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          tags: pdfxyz-web:ci
          push: false
          load: true
          cache-from: |
            type=gha,scope=pdfxyz-web
            type=gha,scope=pdfxyz-worker
          cache-to: type=gha,mode=max,scope=pdfxyz-web

      # Build the worker target (the daemon + native engines). Reuses the shared
      # base/deps/build layers from the web build's cache, so `pnpm build` is not
      # repeated. Never pushed.
      - name: Build worker image target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          tags: pdfxyz-worker:ci
          push: false
          load: true
          cache-from: |
            type=gha,scope=pdfxyz-worker
            type=gha,scope=pdfxyz-web
          cache-to: type=gha,mode=max,scope=pdfxyz-worker

      # ----------------------------------------------------------------------- #
      # Smoke — every step below runs INSIDE the already-built worker image, so a
      # failure here is a CONTRACT failure (the image is wrong), cleanly separated
      # from the build-failures of the two steps above (the image did not build).
      # ----------------------------------------------------------------------- #

      # Headline honesty check: run the REAL worker CLI inside the built image with
      # NO providers configured. It must pass the honest-refusal contract — report
      # not-configured / refuse to fabricate work (exit 2), reject bad flags
      # (exit 1), and fail fast on a dangerous config (exit 4) — never invent a job.
      - name: Worker no-config honesty smoke (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:smoke

      # Image-level engine proof: run the native-engine + OCR smoke INSIDE the built
      # worker image. It asserts the deep-compression + OCR binaries and the English
      # OCR language data are actually installed, that opting into OCR flips
      # `ocr_health` to ready here (a real engine is present), and that native engines
      # never fake drainability — all presence-only: no cloud, no secret, no document.
      - name: Worker image native-engine + OCR smoke (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:image-smoke

      # Engine preflight, POSITIVE path: the node-free `worker:engines` preflight must
      # PASS (exit 0) inside the built image with the production require-flags armed —
      # OCR opted in and both `require OCR` + `require deep engine` demanded — precisely
      # because the image genuinely ships the engines. This proves the packaged engines
      # satisfy the exact opt-in gates an operator arms in production (the Docker-free
      # unit test proves the negative path, where the same flags fail on a bare host).
      # Presence-only: no cloud, secret, queue, store, or document.
      - name: Worker image engine preflight passes with require-flags armed
        run: |
          docker run --rm \
            -e PDFXYZ_OCR=on \
            -e PDFXYZ_WORKER_REQUIRE_OCR=true \
            -e PDFXYZ_WORKER_REQUIRE_DEEP_ENGINE=true \
            pdfxyz-worker:ci pnpm worker:engines

      # Deterministic native OCR proof (Phase 25): after presence is established, prove
      # the packaged Tesseract baseline can actually RECOGNIZE text end-to-end. It
      # generates a tiny synthetic raster of a known sentinel (Ghostscript), OCRs it to
      # a searchable PDF + text sidecar (Tesseract), and asserts the sidecar contains
      # the sentinel — real recognition, not just structure. It uses NO user document,
      # cloud service, secret, queue, store, or scanner; its output is presence-only and
      # content-free (no path or recognized text), and it always cleans up its temp dir.
      - name: Worker image deterministic OCR recognition proof (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:ocr-proof

      # Deterministic OCRmyPDF searchable-PDF proof (Phase 27): the PDF→PDF counterpart
      # of the recognition proof above. It generates a tiny IMAGE-ONLY PDF (Ghostscript's
      # pdfimage device — a raster page, no text layer), confirms pdftotext extracts NO
      # selectable text from it, runs OCRmyPDF to add a text layer, and then confirms
      # pdftotext extracts the sentinel from the OUTPUT PDF — proving image-only became
      # genuinely searchable. It uses NO user document, cloud service, secret, queue,
      # store, or scanner; its output is presence-only and content-free (no path or
      # recognized text), and it always cleans up its temp dir.
      - name: Worker image OCRmyPDF searchable-PDF proof (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:ocrmypdf-proof

      # PDF/A proof: the only place the PDF/A argv meets a real Ghostscript before
      # production. Every unit test of it runs where gs is not installed, so they
      # prove the code asks the right question, never that gs answers it. This
      # converts a generated document with the REAL runner, the image's own sRGB
      # profile and the output gate, and fails unless the result declares
      # PDF/A-2b (a /GTS_PDFA1 OutputIntent and XMP part 2 / B). It also proves,
      # with the image's qpdf, that an open-password file is refused as
      # password_required and a permissions-only file is not. No user document,
      # cloud service, secret, queue or store; content-free output.
      - name: Worker image PDF/A conversion proof (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:pdfa-proof

      # PDF to PowerPoint round-trip fidelity: the only place the faithful
      # export meets poppler's pdftotext, pdf.js and LibreOffice together
      # before production. CI's unit job has neither native engine, and no
      # vitest suite runs in the image, so `fidelity.roundtrip.test.ts` skips
      # there. This runs each generated fixture through the REAL engine, turns
      # the deck back into a PDF with the LibreOffice runner PowerPoint to PDF
      # uses, and compares the pages; the text-only deck shipped until
      # 2026-10-10 and a blank deck must both FAIL the same bound. No user
      # document, cloud service, secret, queue or store; content-free output.
      - name: Worker image PDF to PowerPoint round-trip fidelity proof (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:pptx-fidelity-proof

      # PDF to Word's pictures: the only place poppler's reading order and
      # pdf.js's pictures meet before production (CI's unit job has no
      # poppler; its tests stand it in). Each generated fixture through the
      # REAL engine, judged by the picture instrument; each .docx laid out by
      # the LibreOffice runner Word to PDF uses, which must paint every
      # picture; the text-only .docx shipped until 2026-10-17 and a .docx
      # missing one picture must both FAIL; a damaged fixture is rebuilt by
      # the image's qpdf. No user document, secret, queue or store.
      - name: Worker image PDF to Word pictures proof (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:docx-pictures-proof

      # Worker options (2026-10-24): compress-pdf's Grayscale through the
      # image's REAL Ghostscript, read back as 1-component images (with a
      # colour run as the control), and protect-pdf's permission restrictions
      # through its REAL qpdf at AES-256 and AES-128, read back from the
      # output's /P and cross-checked against qpdf's own --show-encryption.
      # Every unit test of these runs without either binary. Since
      # 2026-10-25 also HTML to PDF's page layout through the image's REAL
      # Chromium: A4 landscape page boxes, one long page, desktop and phone
      # screen widths, each read back from the PDF, with the default render
      # as the control. No user document, secret, queue or store;
      # content-free output.
      - name: Worker image options proof — grayscale, permissions and page layout (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:options-proof

      # OCR languages (2026-10-25): the image's own `tesseract --list-langs`
      # must name every language the product offers (derived from
      # OCR_LANGUAGES, not typed), and a page in each sample script — typed
      # by the image's Chromium, then scanned to pixels — must come back
      # word for word, in reading order (right-to-left scripts included),
      # through the REAL OCR PDF processor's sidecar and text layer and the
      # REAL PDF to Word processor's DOCX. A Greek scan read as English must
      # fail the same verdict. No user document, secret, queue or store.
      - name: Worker image OCR languages proof — packs, recognition, reading order (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:ocr-languages-proof

      # The container HEALTHCHECK / readiness probe must honestly report
      # not-configured (exit 2) when nothing is wired — it claims no job.
      - name: Worker readiness probe is honest with no config (exit 2)
        run: |
          set +e
          docker run --rm pdfxyz-worker:ci pnpm worker:daemon --dry-run-status
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::worker --dry-run-status expected exit 2 (not configured), got $code"
            exit 1
          fi
          echo "worker readiness honestly reported not-configured (exit 2)"

      # Separation, proven at the image level (not just in the Dockerfile text): the
      # worker image DOES ship the native deep-compression AND OCR engines, plus the
      # proof-only `pdftotext` (poppler-utils) the searchable-PDF proof needs.
      - name: Worker image ships the native deep-compression + OCR engines (and pdftotext)
        run: docker run --rm pdfxyz-worker:ci sh -c 'command -v gs && command -v qpdf && command -v mutool && command -v tesseract && command -v ocrmypdf && command -v pdftotext'

      # …and the web image ships NONE of them — the web app never does worker work, and
      # never carries the OCR engines or the proof-only pdftotext tool.
      - name: Web image ships no native engines or proof tools (web ↔ worker separation)
        run: |
          if docker run --rm pdfxyz-web:ci sh -c 'command -v gs || command -v qpdf || command -v mutool || command -v tesseract || command -v ocrmypdf || command -v pdftotext'; then
            echo "::error::web image unexpectedly contains a native PDF/OCR engine or proof tool"
            exit 1
          fi
          echo "web image ships no native engines or proof tools, as designed"
