name: Container images

# Builds the two INDEPENDENT Dockerfile targets — `web` and `worker` — as
# first-class CI checks, and exercises the worker image's no-config honesty
# contract. This is the real Docker build the repo's own build environment cannot
# run (no reachable Docker daemon there); the static tests under `src/deploy/`
# pin the Dockerfile/compose invariants, and this workflow proves the images
# actually build and that the worker stays honest with nothing configured.
#
# Secrets policy — load-bearing: this workflow needs NO secrets and configures no
# provider. Images are built with `push: false` (never published) and the worker
# is smoked with NOTHING wired, so the daemon must refuse to fabricate work.
# Nothing below references a repository secret or names a provider value.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build web + worker images · worker no-config smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the web target only (the Next.js site). Loaded into the local image
      # store so the separation checks below can run it. Never pushed.
      - name: Build web image target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          tags: pdfxyz-web:ci
          push: false
          load: true
          cache-from: |
            type=gha,scope=pdfxyz-web
            type=gha,scope=pdfxyz-worker
          cache-to: type=gha,mode=max,scope=pdfxyz-web

      # Build the worker target (the daemon + native engines). Reuses the shared
      # base/deps/build layers from the web build's cache, so `pnpm build` is not
      # repeated. Never pushed.
      - name: Build worker image target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          tags: pdfxyz-worker:ci
          push: false
          load: true
          cache-from: |
            type=gha,scope=pdfxyz-worker
            type=gha,scope=pdfxyz-web
          cache-to: type=gha,mode=max,scope=pdfxyz-worker

      # ----------------------------------------------------------------------- #
      # Smoke — every step below runs INSIDE the already-built worker image, so a
      # failure here is a CONTRACT failure (the image is wrong), cleanly separated
      # from the build-failures of the two steps above (the image did not build).
      # ----------------------------------------------------------------------- #

      # Headline honesty check: run the REAL worker CLI inside the built image with
      # NO providers configured. It must pass the honest-refusal contract — report
      # not-configured / refuse to fabricate work (exit 2), reject bad flags
      # (exit 1), and fail fast on a dangerous config (exit 4) — never invent a job.
      - name: Worker no-config honesty smoke (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:smoke

      # Image-level engine proof: run the native-engine + OCR smoke INSIDE the built
      # worker image. It asserts the deep-compression + OCR binaries and the English
      # OCR language data are actually installed, that opting into OCR flips
      # `ocr_health` to ready here (a real engine is present), and that native engines
      # never fake drainability — all presence-only: no cloud, no secret, no document.
      - name: Worker image native-engine + OCR smoke (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:image-smoke

      # Engine preflight, POSITIVE path: the node-free `worker:engines` preflight must
      # PASS (exit 0) inside the built image with the production require-flags armed —
      # OCR opted in and both `require OCR` + `require deep engine` demanded — precisely
      # because the image genuinely ships the engines. This proves the packaged engines
      # satisfy the exact opt-in gates an operator arms in production (the Docker-free
      # unit test proves the negative path, where the same flags fail on a bare host).
      # Presence-only: no cloud, secret, queue, store, or document.
      - name: Worker image engine preflight passes with require-flags armed
        run: |
          docker run --rm \
            -e PDFXYZ_OCR=on \
            -e PDFXYZ_WORKER_REQUIRE_OCR=true \
            -e PDFXYZ_WORKER_REQUIRE_DEEP_ENGINE=true \
            pdfxyz-worker:ci pnpm worker:engines

      # Deterministic native OCR proof (Phase 25): after presence is established, prove
      # the packaged Tesseract baseline can actually RECOGNIZE text end-to-end. It
      # generates a tiny synthetic raster of a known sentinel (Ghostscript), OCRs it to
      # a searchable PDF + text sidecar (Tesseract), and asserts the sidecar contains
      # the sentinel — real recognition, not just structure. It uses NO user document,
      # cloud service, secret, queue, store, or scanner; its output is presence-only and
      # content-free (no path or recognized text), and it always cleans up its temp dir.
      - name: Worker image deterministic OCR recognition proof (inside the built worker image)
        run: docker run --rm pdfxyz-worker:ci pnpm worker:ocr-proof

      # The container HEALTHCHECK / readiness probe must honestly report
      # not-configured (exit 2) when nothing is wired — it claims no job.
      - name: Worker readiness probe is honest with no config (exit 2)
        run: |
          set +e
          docker run --rm pdfxyz-worker:ci pnpm worker:daemon --dry-run-status
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::worker --dry-run-status expected exit 2 (not configured), got $code"
            exit 1
          fi
          echo "worker readiness honestly reported not-configured (exit 2)"

      # Separation, proven at the image level (not just in the Dockerfile text):
      # the worker image DOES ship the native deep-compression AND OCR engines.
      - name: Worker image ships the native deep-compression + OCR engines
        run: docker run --rm pdfxyz-worker:ci sh -c 'command -v gs && command -v qpdf && command -v mutool && command -v tesseract && command -v ocrmypdf'

      # …and the web image ships NONE of them — the web app never does worker work.
      - name: Web image ships no native engines (web ↔ worker separation)
        run: |
          if docker run --rm pdfxyz-web:ci sh -c 'command -v gs || command -v qpdf || command -v mutool || command -v tesseract || command -v ocrmypdf'; then
            echo "::error::web image unexpectedly contains a native PDF/OCR engine"
            exit 1
          fi
          echo "web image ships no native engines, as designed"
