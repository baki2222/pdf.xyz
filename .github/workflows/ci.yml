name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Gate, not decoration: the repo was swept clean in the same PR that
      # added this step. A sweep without a gate just resets the clock — within
      # a week the formatter is noise again and cannot be trusted to say
      # anything.
      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # Docker-free worker contract: the REAL daemon CLI must refuse to fabricate
      # work with nothing configured (exit 2), reject bad flags (exit 1), and fail
      # fast on a dangerous config (exit 4). The container workflow re-runs this
      # inside the built worker image; here it gates every PR without Docker.
      - name: Worker no-config honesty smoke
        run: pnpm worker:smoke

      - name: Build
        run: pnpm build

      # Runs AFTER the build on purpose: it weighs the chunks the built pages
      # reference, so `.next` has to exist. Kept out of `pnpm test` for the same
      # reason — a budget check that silently passes with nothing to measure is
      # a guard that guards nothing.
      - name: Bundle budget
        run: pnpm test:bundle

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run Playwright smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
