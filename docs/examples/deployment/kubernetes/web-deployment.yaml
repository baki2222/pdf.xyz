apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdfxyz-web
  namespace: pdfxyz
  labels:
    app.kubernetes.io/name: pdfxyz
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pdfxyz
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdfxyz
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/REPLACE-ME/pdfxyz-web:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # The public web pod takes NO worker secret and NO worker-only config: it does
          # not mount `pdfxyz-config` (which carries engine/heartbeat/ops-check knobs) or
          # `pdfxyz-worker-secrets`. It serves with nothing but NODE_ENV by default. Wire
          # the SAME storage/queue vars here only if you also want the web tier to mint
          # signed URLs / record jobs (see RUNBOOK §2) — provider selectors, never engines.
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 60
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pdfxyz-web
  namespace: pdfxyz
  labels:
    app.kubernetes.io/name: pdfxyz
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pdfxyz
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
