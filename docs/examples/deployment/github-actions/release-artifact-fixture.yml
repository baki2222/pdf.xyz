name: pdf.xyz worker release evidence artifact

# Runs the offline RELEASE EVIDENCE ARTIFACT (Phase 47) as a pre-deploy job: it runs the release
# gate, archives its result with bounded git/release provenance + an integrity digest, uploads the
# artifact as a CI artifact, and re-verifies the digest. It makes NO cloud call, needs NO credentials,
# reads NO secret, and deletes NOTHING — every step is offline and deterministic (committed
# content-free fixtures or the offline gate). This is a TEMPLATE.
#
# The artifact is evidence AGGREGATION + INTEGRITY over content-free data, not a signature, live cloud
# validation, or deletion proof: a `pass` records the gate evidence on THIS build with a tamper-evident
# digest, not real bucket lifecycle, byte deletion, or CDN state. Run your changed-file no-secret /
# no-NUL scan separately (this artifact records the gate result but does not diff the working tree).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lib/workers/release-artifact/**"
      - "scripts/worker-release-artifact.ts"
      - ".github/workflows/**"

jobs:
  release-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1) Run the release gate and capture its content-free result.
      - name: Run the release gate
        run: pnpm -s worker:release-gate --json > gate.json || true

      # 2) Archive the gate result with git provenance + an integrity digest as the release artifact.
      #    The gate result gates the exit; a clean pass writes a promote-able artifact (exit 0).
      - name: Write the release evidence artifact
        run: pnpm -s worker:release-artifact --release-gate=gate.json --output=release-artifact.json --json

      # 3) Re-verify the archived artifact's integrity: recompute the digest over the canonical body
      #    and confirm it matches. A mismatch fails closed (exit 4).
      - name: Verify the artifact integrity digest
        run: |
          set +e
          pnpm -s worker:release-artifact --verify=release-artifact.json
          code=$?
          test "$code" -eq 0 || { echo "integrity verification failed with $code"; exit 1; }

      # 4) A tampered artifact MUST fail verification (exit 4) — proves the digest is load-bearing.
      - name: A tampered artifact fails verification (exit 4)
        run: |
          set +e
          sed 's/"schemaVersion": 1/"schemaVersion": 2/' release-artifact.json > tampered.json
          pnpm -s worker:release-artifact --verify=tampered.json >/dev/null 2>&1
          code=$?
          test "$code" -eq 4 || { echo "expected 4, got $code"; exit 1; }

      # 5) A misused CLI fails closed to the distinct usage band (exit 1) — never a silent pass.
      - name: An invalid release label fails closed (exit 1)
        run: |
          set +e
          pnpm -s worker:release-artifact --release-gate=gate.json --label="not a valid label" >/dev/null 2>&1
          code=$?
          test "$code" -eq 1

      # 6) Publish the artifact as a CI artifact / release record.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-artifact
          path: release-artifact.json

      - name: Release-artifact module unit + CLI smoke tests (no-leak + digest verification)
        run: pnpm exec vitest run src/lib/workers/release-artifact
