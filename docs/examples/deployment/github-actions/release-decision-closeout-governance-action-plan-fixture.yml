name: Release decision closeout governance action plan fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 1,7 *"

# A release-governance REVIEW step, not a per-release gate: after a bounded history of release-decision
# GOVERNANCE-INDEX windows has been summarized into ONE `pdfxyz.release-decision-closeout-governance-index-trend/1` trend
# (Phase 71), this translates that ONE content-free trend into ONE `pdfxyz.release-decision-closeout-governance-action-plan/1`
# operator follow-up plan — a plan verdict (clear / investigate / monitor / block-release), an urgency, an action class,
# the surfaced source trend verdict / class / arc / latest governance-index posture, and an ordered next-action checklist.
# It re-validates the trend against itself (a hand-flipped trend verdict is caught as a tamper) and FAILS CLOSED: an
# unreadable / tampered trend input, a `trend-blocked` history, or a `--strict-watch` escalation is block-release (exit 4).
# It is a content-free operational follow-up plan ONLY: it is NOT a legal / compliance sign-off, an external approval /
# signature, an identity proof, a deployment authorization, a promotion ledger, an incident record, or an audit log, and
# it signs / approves / publishes / promotes / deploys / notifies / mutates NOTHING. It fetches nothing — it composes the
# trend from committed content-free fixtures so the workflow is deterministic and offline.

jobs:
  release-decision-closeout-governance-action-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Summarize a governance-index trend, then plan the follow-up
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plan
          # Summarize a bounded history of committed content-free governance-index windows into ONE trend (a real pipeline
          # archives one `worker:release-decision-closeout-governance-index-trend` summary per governance review period).
          pnpm worker:release-decision-closeout-governance-index-trend \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-indexed.json \
            --output=plan/trend.json
          # Translate the ONE trend into a bounded operator follow-up plan.
          pnpm worker:release-decision-closeout-governance-action-plan \
            --trend=plan/trend.json \
            --output=plan/governance-action-plan.json
          # Render the plan into the job summary.
          pnpm worker:release-decision-closeout-governance-action-plan \
            --trend=plan/trend.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCKED trend (an index-blocked latest window) → block-release (exit 4) — hold promotion and reconcile.
          set +e
          pnpm worker:release-decision-closeout-governance-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-action-plan/trend-blocked.json --json >/tmp/gplan-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A non-trend decoy can't be trusted → block-release (exit 4), never a vacuous clear plan.
          set +e
          pnpm worker:release-decision-closeout-governance-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-action-plan/not-a-trend.json --json >/tmp/gplan-reject.json
          code=$?
          set -e
          test "$code" -eq 4

          # A watch / degrading trend → a follow-up monitor plan (exit 3) for review, not a clean pass.
          set +e
          pnpm worker:release-decision-closeout-governance-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-action-plan/trend-watch.json --json >/tmp/gplan-monitor.json
          code=$?
          set -e
          test "$code" -eq 3

          # An inconclusive (trend-incomplete) history → investigate (exit 2), not clean.
          set +e
          pnpm worker:release-decision-closeout-governance-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-action-plan/trend-incomplete.json --json >/tmp/gplan-investigate.json
          code=$?
          set -e
          test "$code" -eq 2

          # --strict-watch escalates a monitor (watch / degrading) trend to block-release (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-action-plan/trend-watch.json --strict-watch --json >/tmp/gplan-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # No trend supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-governance-action-plan --json >/tmp/gplan-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-governance-action-plan
          path: plan/governance-action-plan.json
          if-no-files-found: error
