name: Release decision closeout governance finalize index trend FINALIZATION record fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 3,9 *"

# A release-governance REVIEW step, not a per-release gate: after a finalize-index-trend follow-up plan has had its
# execution receipt recorded (Phase 78), this FINALIZES the follow-up loop — it ingests ONE
# `pdfxyz.release-decision-closeout-governance-finalize-index-trend-action-receipt/1` primary receipt plus, optionally, the
# source-chain records it was built from (the Phase 77 plan, the Phase 76 trend, the Phase 75 index, the Phase 74
# finalization), re-validates each against itself, cross-checks the loop, and emits ONE
# `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize/1` record: a finalization verdict
# (finalized / finalize-open / finalize-incomplete / finalize-blocked / finalize-invalid), a source-chain checklist, and a
# bounded next-action list. It is a content-free operational FINALIZATION record ONLY: it is NOT a legal / compliance
# sign-off, an external approval / signature, an identity proof, a deployment authorization, a promotion ledger, an
# incident record, or an audit log, and it signs / approves / publishes / promotes / deploys / notifies / mutates NOTHING.
# It fetches nothing — it composes the chain from committed content-free fixtures so the workflow is deterministic and
# offline.

jobs:
  release-decision-closeout-governance-finalize-index-trend-finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the finalize-index-trend chain, then finalize the follow-up loop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p finalize
          # Summarize a bounded history of committed content-free finalize-index windows into ONE trend, translate that
          # trend into a follow-up plan, and record its execution receipt (a real pipeline archives one per review period).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend \
            --file=docs/examples/release-decision-closeout-governance-finalize-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-finalize-index-trend/window-indexed.json \
            --output=finalize/trend.json
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-plan \
            --trend=finalize/trend.json \
            --output=finalize/plan.json
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=finalize/plan.json \
            --ack-plan \
            --output=finalize/receipt.json
          # Finalize the follow-up loop: a completed receipt + its coherent plan / trend → finalized (exit 0).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=finalize/receipt.json \
            --plan=finalize/plan.json \
            --trend=finalize/trend.json \
            --output=finalize/finalize-index-trend-finalize.json
          # Render the finalization record into the job summary.
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=finalize/receipt.json \
            --plan=finalize/plan.json \
            --trend=finalize/trend.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          D=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize

          # A completed receipt alone → finalized (exit 0), the happy path.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/receipt-completed.json --json >/tmp/final-finalized.json
          code=$?
          set -e
          test "$code" -eq 0

          # An incomplete receipt → finalize-incomplete (exit 2), a coverage gap for review.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/receipt-incomplete.json --json >/tmp/final-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # A required-but-missing source-chain record → finalize-incomplete (exit 2).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/receipt-completed.json --require-index --json >/tmp/final-required.json
          code=$?
          set -e
          test "$code" -eq 2

          # An advisory chain (a coherent degrading trend) → finalize-open (exit 3), track it to closure.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/receipt-advisory.json --trend=$D/trend-advisory.json --json >/tmp/final-open.json
          code=$?
          set -e
          test "$code" -eq 3

          # --strict-open escalates the advisory chain to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/receipt-advisory.json --trend=$D/trend-advisory.json --strict-open --json >/tmp/final-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # A blocked receipt → finalize-blocked (exit 4), the loop stays held.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/receipt-blocked.json --json >/tmp/final-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A contradictory source-chain record (a plan the receipt did not receipt) → finalize-blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/receipt-completed.json --plan=$D/plan-contradictory.json --json >/tmp/final-contra.json
          code=$?
          set -e
          test "$code" -eq 4

          # A tampered receipt → finalize-invalid (exit 4), never a vacuous finalized.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/receipt-tampered.json --json >/tmp/final-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # A missing / unreadable receipt decoy → finalize-invalid (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize \
            --receipt=$D/not-a-receipt.json --json >/tmp/final-unreadable.json
          code=$?
          set -e
          test "$code" -eq 4

          # No receipt supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize --json >/tmp/final-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-governance-finalize-index-trend-finalize
          path: finalize/finalize-index-trend-finalize.json
          if-no-files-found: error
