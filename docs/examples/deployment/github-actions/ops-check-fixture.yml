name: pdf.xyz ops-check fixture gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/examples/observability/healthcheck/**"
      - "src/lib/workers/ops-check/**"
      - "src/lib/workers/observability/alerts.ts"
      - ".github/workflows/**"

jobs:
  ops-check-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Healthy fixture exits 0
        run: pnpm -s worker:ops-check --file=docs/examples/observability/healthcheck/healthy.json --json
      - name: Stale heartbeat fixture exits 3
        run: |
          set +e
          pnpm -s worker:ops-check --file=docs/examples/observability/healthcheck/stale-heartbeat.json --json
          code=$?
          test "$code" -eq 3
      - name: Lifecycle drift fixture exits 4
        run: |
          set +e
          pnpm -s worker:ops-check --file=docs/examples/observability/healthcheck/lifecycle-drift.json --json
          code=$?
          test "$code" -eq 4
