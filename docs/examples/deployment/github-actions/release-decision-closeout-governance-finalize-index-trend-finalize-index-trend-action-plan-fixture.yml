name: Release decision closeout governance finalize index trend finalize index trend action plan fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 1,7 *"

# A release-governance REVIEW step, not a per-release gate: after a bounded history of release-decision closeout
# governance FINALIZE-INDEX windows has been summarized into ONE
# `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize-index-trend/1` trend (Phase 81), this translates that ONE
# content-free trend into ONE `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan/1` operator
# follow-up plan — a plan verdict (clear / monitor / investigate / block-release / invalid), an urgency, an action class,
# the surfaced source trend verdict / class / arc / latest finalize-index posture, and an ordered next-action checklist.
# It re-validates the trend against itself (a hand-flipped trend verdict is caught as a tamper) and FAILS CLOSED: an
# unreadable / tampered trend input is invalid (exit 4); a blocked / invalid-history trend, or a --strict-watch /
# --require-clean escalation, is block-release (exit 4). It is a content-free operational follow-up plan ONLY: it is NOT a
# legal / compliance sign-off, an external approval / signature, an identity proof, a deployment authorization, a
# promotion ledger, an incident record, or an audit log, and it signs / approves / publishes / promotes / deploys /
# notifies / mutates NOTHING. It fetches nothing — it composes the trend from committed content-free fixtures so the
# workflow is deterministic and offline.

jobs:
  release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Summarize a finalize-index trend, then plan the follow-up
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plan
          # Summarize a bounded history of committed content-free finalize-index windows into ONE trend (a real pipeline
          # archives one `worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend` summary per governance review
          # period).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend \
            --file=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend/window-indexed.json \
            --output=plan/trend.json
          # Translate the ONE trend into a bounded operator follow-up plan.
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan \
            --trend=plan/trend.json \
            --output=plan/finalize-index-trend-action-plan.json
          # Render the plan into the job summary.
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan \
            --trend=plan/trend.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCKED trend (an index-blocked latest window) → block-release (exit 4) — hold promotion and reconcile.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan/trend-blocked.json --json >/tmp/fplan-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A non-trend decoy can't be trusted → invalid (exit 4), never a vacuous clear plan.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan/not-a-trend.json --json >/tmp/fplan-reject.json
          code=$?
          set -e
          test "$code" -eq 4

          # A watch / degrading trend → a follow-up monitor plan (exit 3) for review, not a clean pass.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan/trend-degrading.json --json >/tmp/fplan-monitor.json
          code=$?
          set -e
          test "$code" -eq 3

          # An inconclusive (insufficient) history → investigate (exit 2), not clean.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan/trend-insufficient.json --json >/tmp/fplan-investigate.json
          code=$?
          set -e
          test "$code" -eq 2

          # --strict-watch escalates a monitor (watch / degrading) trend to block-release (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan/trend-degrading.json --strict-watch --json >/tmp/fplan-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # --require-clean escalates every non-clear trend (including insufficient) to block-release (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan \
            --trend=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan/trend-insufficient.json --require-clean --json >/tmp/fplan-require-clean.json
          code=$?
          set -e
          test "$code" -eq 4

          # No trend supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan --json >/tmp/fplan-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-plan
          path: plan/finalize-index-trend-action-plan.json
          if-no-files-found: error
