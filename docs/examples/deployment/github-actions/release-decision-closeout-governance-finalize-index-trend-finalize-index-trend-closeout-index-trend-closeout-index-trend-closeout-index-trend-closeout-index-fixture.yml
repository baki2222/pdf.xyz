name: Release decision closeout governance finalize index trend finalize index trend closeout index trend closeout index trend closeout index trend closeout INDEX fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 1 3,9 *"

# A release-governance REVIEW step, not a per-release gate: after each closeout-index-trend follow-up loop has been
# CLOSED OUT into ONE `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout/1`
# record (Phase 94), this INDEXES a bounded WINDOW of those closeout records into ONE
# `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index/1`
# summary: an index verdict (all-closed / open / incomplete / blocked / invalid), the closeout-verdict distribution, a
# bounded summary of the newest usable closeout, and a per-record posture sequence. It re-validates each record against
# itself (a hand-flipped closeout verdict / exit / rollup, or a flipped receipt / source-chain posture signal, is caught
# as a tamper) and is LATEST-FOCUSED: the newest usable record drives the verdict, bounded history thresholds (--max-open
# / --max-incomplete, each default 0) tolerate a bounded number of non-closed OLDER records, any blocked record escalates
# to blocked, a usable record whose own verdict is invalid (or zero usable records) fails closed to invalid (the top
# precedence), and --strict-open escalates any open / incomplete window to a hard block. It is a content-free
# closeout-history INDEX SUMMARY ONLY: it is NOT a legal / compliance sign-off, an external approval / signature, an
# identity proof, a deployment authorization, a promotion ledger, an incident record, or an audit log, and it signs /
# approves / publishes / promotes / deploys / notifies / mutates NOTHING. It fetches nothing — it builds the closeout
# history from committed content-free fixtures so the workflow is deterministic and offline.

jobs:
  release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Close out a window of follow-up loops, then index it
        shell: bash
        env:
          CX: docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout
        run: |
          set -euo pipefail
          mkdir -p closeout-index
          # CLOSE OUT one closeout-index-trend follow-up loop (a completed action-plan execution receipt) into ONE
          # closeout record — repeated for three "releases", oldest first / newest last.
          for n in 1 2 3; do
            pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout \
              --receipt="$CX/receipt-completed.json" \
              --output="closeout-index/c${n}.json"
          done
          # Index the bounded window (oldest first, newest last) → all-closed (a coherent, consistently-closed history).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index \
            --file=closeout-index/c1.json \
            --file=closeout-index/c2.json \
            --file=closeout-index/c3.json \
            --output=closeout-index/index.json
          # Render the index into the job summary.
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index \
            --file=closeout-index/c1.json \
            --file=closeout-index/c2.json \
            --file=closeout-index/c3.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          D=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index

          # A blocked latest closeout record → blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index \
            --file=$D/closeout-closed.json \
            --file=$D/closeout-blocked.json --json >/tmp/cidx-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A tampered closeout record fails closed → invalid (exit 4), the top precedence.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index \
            --file=$D/closeout-closed.json \
            --file=$D/closeout-tampered.json --json >/tmp/cidx-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # An unreadable (non-closeout) input fails closed → invalid (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index \
            --file=$D/not-a-closeout.json --json >/tmp/cidx-unreadable.json
          code=$?
          set -e
          test "$code" -eq 4

          # --strict-open escalates an open OR incomplete window to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index \
            --file=$D/closeout-open.json \
            --strict-open --json >/tmp/cidx-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # A latest-open history (an advisory follow-up still open) → open (exit 3), for review.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index \
            --file=$D/closeout-closed.json \
            --file=$D/closeout-open.json --json >/tmp/cidx-open.json
          code=$?
          set -e
          test "$code" -eq 3

          # A latest-incomplete history → incomplete (exit 2), a coverage gap.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index \
            --file=$D/closeout-closed.json \
            --file=$D/closeout-incomplete.json --json >/tmp/cidx-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # No closeout record supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index --json >/tmp/cidx-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-closeout-index-trend-closeout-index
          path: closeout-index/index.json
          if-no-files-found: error
