name: Release decision closeout index fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 1 1,4,7,10 *"

# A release-governance REVIEW step, not a per-release gate: after each release has been closed out as ONE
# `pdfxyz.release-decision-closeout/1` record (Phase 64), this INDEXES a bounded HISTORY of those closeout records into
# ONE `pdfxyz.release-decision-closeout-index/1` summary: an index verdict (indexed / index-incomplete / index-open /
# index-blocked), the closeout-verdict distribution, the latest / oldest closeout verdict, and a per-record posture
# sequence. It re-validates each closeout against itself (a hand-flipped closeout verdict / exit / rollup is caught as a
# tamper) and is LATEST-FOCUSED: the newest usable closeout drives the verdict, and bounded history thresholds
# (--max-open / --max-incomplete / --max-blocked, each default 0) tolerate a bounded number of non-closed closeouts. It
# is a content-free closeout-ledger INDEX SUMMARY ONLY: it is NOT a legal / compliance sign-off, an external approval /
# signature, an identity proof, a deployment authorization, a promotion ledger, an incident record, or an audit log, and
# it signs / approves / publishes / promotes / deploys / notifies / mutates NOTHING. It fetches nothing — it builds the
# closeout history from committed content-free fixtures so the workflow is deterministic and offline.

jobs:
  release-decision-closeout-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Record the closeout history, then index it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p closeout-index
          # Close out three releases (each a completed receipt → a `closed` closeout), oldest first / newest last.
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-completed.json \
            --output=closeout-index/c1.json
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-completed.json \
            --plan=docs/examples/release-decision-closeout/plan-coherent.json \
            --trend=docs/examples/release-decision-closeout/trend-coherent.json \
            --output=closeout-index/c2.json
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-completed.json \
            --output=closeout-index/c3.json
          # Index the bounded history (oldest first, newest last) → indexed (a coherent, consistently-closed history).
          pnpm worker:release-decision-closeout-index \
            --file=closeout-index/c1.json \
            --file=closeout-index/c2.json \
            --file=closeout-index/c3.json \
            --output=closeout-index/index.json
          # Render the index into the job summary.
          pnpm worker:release-decision-closeout-index \
            --file=closeout-index/c1.json \
            --file=closeout-index/c2.json \
            --file=closeout-index/c3.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A blocked latest closeout → index-blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-index \
            --file=docs/examples/release-decision-closeout-index/closeout-closed.json \
            --file=docs/examples/release-decision-closeout-index/closeout-blocked.json --json >/tmp/coidx-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A tampered closeout record fails closed → index-blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-index \
            --file=docs/examples/release-decision-closeout-index/closeout-closed.json \
            --file=docs/examples/release-decision-closeout-index/closeout-tampered.json --json >/tmp/coidx-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # --strict-open escalates an open history to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-index \
            --file=docs/examples/release-decision-closeout-index/closeout-open.json \
            --strict-open --json >/tmp/coidx-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # A latest-open history (an advisory follow-up still open) → index-open (exit 3), for review.
          set +e
          pnpm worker:release-decision-closeout-index \
            --file=docs/examples/release-decision-closeout-index/closeout-closed.json \
            --file=docs/examples/release-decision-closeout-index/closeout-open.json --json >/tmp/coidx-open.json
          code=$?
          set -e
          test "$code" -eq 3

          # A latest-incomplete history, or an unreadable closeout → index-incomplete (exit 2).
          set +e
          pnpm worker:release-decision-closeout-index \
            --file=docs/examples/release-decision-closeout-index/closeout-closed.json \
            --file=docs/examples/release-decision-closeout-index/closeout-incomplete.json --json >/tmp/coidx-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # No closeout supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-index --json >/tmp/coidx-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-index
          path: closeout-index/index.json
          if-no-files-found: error
