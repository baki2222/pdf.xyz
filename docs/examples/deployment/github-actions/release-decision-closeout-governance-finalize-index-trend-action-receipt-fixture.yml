name: Release decision closeout governance finalize index trend action-plan execution receipt fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 2,8 *"

# A release-governance REVIEW step, not a per-release gate: after a finalize-index trend has been translated into ONE
# `pdfxyz.release-decision-closeout-governance-finalize-index-trend-action-plan/1` follow-up plan (Phase 77), this records
# whether the operator provided the bounded acknowledgements required to close it out — ONE
# `pdfxyz.release-decision-closeout-governance-finalize-index-trend-action-receipt/1` execution receipt: a receipt verdict
# (completed / incomplete / blocked / invalid), the resolved plan class, and a bounded acknowledgement checklist. The
# acknowledgements are BOUNDED BOOLEANS an operator actually performed — never a free-form note or actor name, and the
# receipt never claims an action was executed unless --ack-executed is supplied. It is a content-free operational
# acknowledgement receipt ONLY: it is NOT a legal / compliance sign-off, an external approval / signature, an identity
# proof, a deployment authorization, a promotion ledger, an incident record, or an audit log, and it signs / approves /
# publishes / promotes / deploys / notifies / mutates NOTHING. It fetches nothing — it composes the plan from committed
# content-free fixtures so the workflow is deterministic and offline.

jobs:
  release-decision-closeout-governance-finalize-index-trend-action-receipt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Translate a finalize-index trend into a plan, then record the execution receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          # Summarize a bounded history of committed content-free finalize-index windows into ONE trend, then translate
          # that ONE trend into a follow-up plan (a real pipeline archives one plan per governance review period).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend \
            --file=docs/examples/release-decision-closeout-governance-finalize-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-finalize-index-trend/window-indexed.json \
            --output=receipt/trend.json
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-plan \
            --trend=receipt/trend.json \
            --output=receipt/plan.json
          # Record the execution receipt: a coherent stable (clear) plan reviewed by the operator → completed (exit 0).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=receipt/plan.json \
            --ack-plan \
            --output=receipt/finalize-index-trend-action-receipt.json
          # Render the receipt into the job summary.
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=receipt/plan.json \
            --ack-reviewed \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCK plan is blocked (exit 4) even fully acknowledged — the release stays held, never promoted.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/plan-block.json \
            --ack-plan --ack-block --ack-executed --json >/tmp/freceipt-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A plan whose own verdict is invalid → invalid (exit 4), even fully acknowledged.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/plan-invalid.json \
            --ack-plan --ack-executed --json >/tmp/freceipt-invalid.json
          code=$?
          set -e
          test "$code" -eq 4

          # A tampered plan fails closed → invalid (exit 4), even fully acknowledged.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/plan-tampered.json \
            --ack-plan --ack-monitor --ack-executed --json >/tmp/freceipt-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # A missing / unreadable plan decoy also fails closed → invalid (exit 4), never a vacuous completed receipt.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/not-a-plan.json --json >/tmp/freceipt-unreadable.json
          code=$?
          set -e
          test "$code" -eq 4

          # A monitor plan reviewed but its follow-up not yet acknowledged / executed → incomplete (exit 2), for review.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/plan-monitor.json \
            --ack-plan --json >/tmp/freceipt-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # A clear plan NOT acknowledged as reviewed → incomplete (exit 2), never a vacuous completed receipt.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/plan-clear.json --json >/tmp/freceipt-unexercised.json
          code=$?
          set -e
          test "$code" -eq 2

          # --strict-open escalates a missing-acknowledgement receipt to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/plan-monitor.json \
            --ack-plan --strict-open --json >/tmp/freceipt-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # A contradictory acknowledgement (ack-block on a clear plan) → blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/plan-clear.json \
            --ack-plan --ack-block --json >/tmp/freceipt-contradiction.json
          code=$?
          set -e
          test "$code" -eq 4

          # A clear plan reviewed → completed (exit 0), the closed-out happy path.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-action-receipt/plan-clear.json \
            --ack-plan --json >/tmp/freceipt-completed.json
          code=$?
          set -e
          test "$code" -eq 0

          # No plan supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-action-receipt --json >/tmp/freceipt-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-governance-finalize-index-trend-action-receipt
          path: receipt/finalize-index-trend-action-receipt.json
          if-no-files-found: error
