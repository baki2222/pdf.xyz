name: Release decision closeout governance index trend fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 1 1,7 *"

# A periodic release-governance REVIEW summary, not a per-release gate: after each review window has been indexed into ONE
# `pdfxyz.release-decision-closeout-governance-index/1` summary (Phase 70), this SUMMARIZES a bounded HISTORY of those
# governance-index windows into ONE `pdfxyz.release-decision-closeout-governance-index-trend/1` trend: a trend verdict
# (trend-stable / trend-incomplete / trend-watch / trend-blocked), the per-window index-verdict distribution, the
# aggregate governance distribution, an arc direction + trend class, and a per-window posture sequence. It re-validates
# each window against itself (a hand-flipped index verdict / count that does not re-derive is caught as a tamper) and is
# LATEST-FOCUSED: the newest usable window drives the verdict, bounded history thresholds (--max-open / --max-incomplete /
# --max-blocked, each default 0) tolerate a bounded number of non-indexed windows, and a worsening arc raises a watch.
# --strict-watch escalates a watch trend to a hard block. It is a content-free governance-index TREND SUMMARY ONLY: it is
# NOT a legal / compliance sign-off, an external approval / signature, an identity proof, a deployment authorization, a
# promotion ledger, an incident record, or an audit log, and it signs / approves / publishes / promotes / deploys /
# notifies / mutates NOTHING. It fetches nothing — it builds the window history from committed content-free fixtures so
# the workflow is deterministic and offline.

jobs:
  release-decision-closeout-governance-index-trend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Index a governance window, then summarize the trend over the window history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p governance-index-trend
          # Index a review window from a bounded governance-bundle history (Phase 70) → one governance-index window
          # (indexed: a coherent, consistently-closed history). This is the freshly-produced NEWEST window.
          pnpm worker:release-decision-closeout-governance-index \
            --file=docs/examples/release-decision-closeout-governance-index/governance-closed.json \
            --file=docs/examples/release-decision-closeout-governance-index/governance-closed-coherent.json \
            --output=governance-index-trend/window-newest.json
          # Summarize a bounded history of governance-index windows (oldest first, newest last) → trend-stable (a
          # coherent, non-degrading history), rendered into the job summary.
          pnpm worker:release-decision-closeout-governance-index-trend \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-indexed.json \
            --file=governance-index-trend/window-newest.json \
            --output=governance-index-trend/trend.json
          pnpm worker:release-decision-closeout-governance-index-trend \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-indexed.json \
            --file=governance-index-trend/window-newest.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A blocked latest window → trend-blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-index-trend \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-blocked.json --json >/tmp/gitrend-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A tampered window anywhere in the history fails closed → trend-blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-index-trend \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-tampered.json --json >/tmp/gitrend-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # --strict-watch escalates a watch history to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-index-trend \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-watch.json \
            --strict-watch --json >/tmp/gitrend-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # A latest-open / degrading history (an advisory follow-up open) → trend-watch (exit 3), for review.
          set +e
          pnpm worker:release-decision-closeout-governance-index-trend \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-watch.json --json >/tmp/gitrend-watch.json
          code=$?
          set -e
          test "$code" -eq 3

          # A flat incomplete history, or an unreadable window → trend-incomplete (exit 2).
          set +e
          pnpm worker:release-decision-closeout-governance-index-trend \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-incomplete.json \
            --file=docs/examples/release-decision-closeout-governance-index-trend/window-incomplete.json --json >/tmp/gitrend-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # No window supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-governance-index-trend --json >/tmp/gitrend-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-governance-index-trend
          path: governance-index-trend/trend.json
          if-no-files-found: error
