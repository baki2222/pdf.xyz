name: Release evidence restore drill fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"

# A scheduled DISASTER-RECOVERY drill, not a per-release gate: it RESTORES an archived release-evidence pack
# (and the underlying records it indexed) and proves they can be re-validated and trusted. It fetches nothing —
# in a real drill the "Restore from archive store" step would pull the files from your bucket / tar / git; here it
# rebuilds them from committed content-free fixtures so the workflow is deterministic and offline.

jobs:
  release-restore-drill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore the archived pack and its underlying records (rebuilt from fixtures here)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restored
          # Restore the underlying records (a real drill copies these from your archive store).
          cp docs/examples/release-restore-drill/governance-healthy.json restored/governance.json
          cp docs/examples/release-restore-drill/trend-stable.json        restored/trend.json
          cp docs/examples/release-restore-drill/report-promote-ready.json restored/report.json
          cp docs/examples/release-restore-drill/audit-pass.json          restored/audit.json
          cp docs/examples/release-restore-drill/bundle-pass.json         restored/bundle.json
          # Rebuild the archive pack over the restored records (a real drill restores the pack itself).
          pnpm worker:release-archive \
            --governance=restored/governance.json \
            --trend=restored/trend.json \
            --report=restored/report.json \
            --audit=restored/audit.json \
            --bundle=restored/bundle.json \
            --output=restored/archive.json

      - name: Drill the restore (verify the pack + every restored record matches)
        shell: bash
        run: |
          set -euo pipefail
          pnpm worker:release-restore-drill \
            --archive=restored/archive.json \
            --governance=restored/governance.json \
            --trend=restored/trend.json \
            --report=restored/report.json \
            --audit=restored/audit.json \
            --bundle=restored/bundle.json \
            --require-full-restore \
            --output=restored/restore-drill.json
          pnpm worker:release-restore-drill \
            --archive=restored/archive.json \
            --governance=restored/governance.json \
            --trend=restored/trend.json \
            --report=restored/report.json \
            --audit=restored/audit.json \
            --bundle=restored/bundle.json \
            --require-full-restore \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A tampered pack must fail the drill (exit 4).
          set +e
          pnpm worker:release-restore-drill --archive=docs/examples/release-restore-drill/archive-tampered.json --archive-only --json >/tmp/drill-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # A drill that restored nothing over a usable pack is insufficient (exit 2).
          set +e
          pnpm worker:release-restore-drill --archive=restored/archive.json --json >/tmp/drill-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # No --archive is a usage error (exit 1).
          set +e
          pnpm worker:release-restore-drill --archive-only --json >/tmp/drill-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-restore-drill
          path: restored/restore-drill.json
          if-no-files-found: error
