name: Release evidence archive pack fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

jobs:
  release-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build content-free governance inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          pnpm worker:release-governance \
            --trend=docs/examples/release-governance/trend-stable.json \
            --report=docs/examples/release-governance/report-promote-ready.json \
            --audit=docs/examples/release-governance/audit-pass.json \
            --output=release-evidence/governance.json

      - name: Compose archive pack manifest
        shell: bash
        run: |
          set -euo pipefail
          pnpm worker:release-archive \
            --governance=release-evidence/governance.json \
            --trend=docs/examples/release-governance/trend-stable.json \
            --report=docs/examples/release-governance/report-promote-ready.json \
            --audit=docs/examples/release-governance/audit-pass.json \
            --bundle=docs/examples/release-report/bundle-pass.json \
            --output=release-evidence/archive.json
          pnpm worker:release-archive \
            --governance=release-evidence/governance.json \
            --trend=docs/examples/release-governance/trend-stable.json \
            --report=docs/examples/release-governance/report-promote-ready.json \
            --audit=docs/examples/release-governance/audit-pass.json \
            --bundle=docs/examples/release-report/bundle-pass.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          set +e
          pnpm worker:release-archive --governance=docs/examples/release-archive/governance-blocked.json --json >/tmp/archive-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          set +e
          pnpm worker:release-archive --governance=docs/examples/release-archive/governance-incomplete.json --json >/tmp/archive-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          set +e
          pnpm worker:release-archive --json >/tmp/archive-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-archive
          path: release-evidence/archive.json
          if-no-files-found: error
