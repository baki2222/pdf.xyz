name: Release evidence handoff acknowledgement fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "53 6 * * 1"

# A handoff-RECORD step, not a per-release gate: after a publish / handoff pack is prepared (or received), it records
# an operator's bounded ACKNOWLEDGEMENT of that content-free `pdfxyz.release-publish-pack/1` — an acknowledgement
# verdict, the recorded decision + reviewer class + note class, and a next-action checklist. It is an acknowledgement
# RECEIPT ONLY: it is NOT an external signature, an approval, an identity attestation, legal / compliance sign-off, or
# a release promotion, and it signs / approves / publishes / promotes / notifies / mutates NOTHING. It fetches nothing
# — it composes a publish pack from committed content-free fixtures so the workflow is deterministic and offline.

jobs:
  release-handoff-ack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compose a publish pack, then record a bounded acknowledgement of it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ack
          # Build the window's governance bundle from a committed content-free trend (a real pipeline archives this).
          pnpm worker:release-governance \
            --trend=docs/examples/release-governance/trend-stable.json \
            --report=docs/examples/release-governance/report-promote-ready.json \
            --audit=docs/examples/release-governance/audit-pass.json \
            --output=ack/governance.json
          # Compose the publish / handoff pack over the governance bundle plus the related content-free records.
          pnpm worker:release-publish-pack \
            --governance=ack/governance.json \
            --archive=docs/examples/release-publish-pack/archive-archivable.json \
            --restore-drill=docs/examples/release-publish-pack/restore-drill-verified.json \
            --output=ack/publish-pack.json
          # Record the operator's acknowledgement of the pack (reviewer + note are BOUNDED classes, never identity).
          pnpm worker:release-ack \
            --publish-pack=ack/publish-pack.json \
            --decision=accepted \
            --reviewer=internal-approver \
            --output=ack/release-ack.json
          # Render the acknowledgement receipt into the job summary.
          pnpm worker:release-ack \
            --publish-pack=ack/publish-pack.json \
            --decision=accepted \
            --reviewer=internal-approver \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCKED publish pack must reject the acknowledgement (exit 4) — do not proceed.
          set +e
          pnpm worker:release-ack --publish-pack=docs/examples/release-handoff-ack/publish-pack-blocked.json --decision=accepted --json >/tmp/ack-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A TAMPERED publish pack can't be trusted → invalid (exit 4), never a vacuous acknowledgement.
          set +e
          pnpm worker:release-ack --publish-pack=docs/examples/release-handoff-ack/publish-pack-tampered.json --decision=accepted --json >/tmp/ack-invalid.json
          code=$?
          set -e
          test "$code" -eq 4

          # An INCOMPLETE pack (insufficient evidence) is deferred (exit 2), not an acceptance.
          set +e
          pnpm worker:release-ack --publish-pack=docs/examples/release-handoff-ack/publish-pack-incomplete.json --decision=accepted --json >/tmp/ack-deferred.json
          code=$?
          set -e
          test "$code" -eq 2

          # No decision is a usage error (exit 1).
          set +e
          pnpm worker:release-ack --publish-pack=docs/examples/release-handoff-ack/publish-pack-publishable.json --json >/tmp/ack-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-handoff-ack
          path: ack/release-ack.json
          if-no-files-found: error
