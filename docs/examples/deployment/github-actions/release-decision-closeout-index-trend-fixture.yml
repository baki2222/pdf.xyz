name: Release decision closeout index trend fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 1,7 *"

# A release-governance REVIEW step, not a per-release gate: after a series of release-decision CLOSEOUT windows has been
# indexed (one `pdfxyz.release-decision-closeout-index/1` per review period, Phase 65), this SUMMARIZES a bounded HISTORY
# of those content-free windows into ONE `pdfxyz.release-decision-closeout-index-trend/1` summary — the per-window
# index-verdict distribution, the aggregate closeout distribution, a per-window posture sequence, an arc direction +
# trend class, a trend verdict (trend-stable / trend-incomplete / trend-watch / trend-blocked), and a next-action
# checklist. It re-validates each window against itself (a hand-flipped index verdict is caught as a tamper) and is
# LATEST-FOCUSED: the newest usable window drives the verdict, bounded history thresholds (--max-watch / --max-incomplete
# / --max-blocked, each default 0) tolerate a bounded number of non-indexed windows, and a worsening ARC raises a watch.
# It is a closeout-index TREND SUMMARY ONLY: it is NOT a legal audit log, a compliance attestation, an external approval
# / signature, an identity proof, or a deployment / promotion ledger, and it signs / approves / publishes / promotes /
# deploys / notifies / mutates NOTHING. It fetches nothing — it composes the history from committed content-free fixtures
# so the workflow is deterministic and offline. Direction is derived from ORDERED INPUT POSITIONS (oldest first, newest
# last), never from any ingested timestamp.

jobs:
  release-decision-closeout-index-trend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Index two closeout windows, then summarize the trend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p indexes
          # Compose two content-free closeout-index windows from committed closeout fixtures (a real pipeline indexes one
          # `worker:release-decision-closeout-index` window per review period and archives it).
          pnpm worker:release-decision-closeout-index \
            --file=docs/examples/release-decision-closeout-index/closeout-closed.json \
            --file=docs/examples/release-decision-closeout-index/closeout-closed.json \
            --output=indexes/w1.json
          pnpm worker:release-decision-closeout-index \
            --file=docs/examples/release-decision-closeout-index/closeout-closed.json \
            --file=docs/examples/release-decision-closeout-index/closeout-closed.json \
            --output=indexes/w2.json
          # Summarize the bounded history (oldest first, newest last) into ONE governance trend summary.
          pnpm worker:release-decision-closeout-index-trend \
            --file=indexes/w1.json \
            --file=indexes/w2.json \
            --output=indexes/closeout-index-trend.json
          # Render the trend into the job summary.
          pnpm worker:release-decision-closeout-index-trend \
            --file=indexes/w1.json \
            --file=indexes/w2.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCKED window in the history blocks the trend (exit 4) — do not treat the history as clean.
          set +e
          pnpm worker:release-decision-closeout-index-trend \
            --file=docs/examples/release-decision-closeout-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-index-trend/window-blocked.json --json >/tmp/coidxtrend-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A TAMPERED window can't be trusted → trend-blocked (exit 4), never a vacuous clean pass.
          set +e
          pnpm worker:release-decision-closeout-index-trend \
            --file=docs/examples/release-decision-closeout-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-index-trend/window-tampered.json --json >/tmp/coidxtrend-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # --strict-watch escalates a watch history (a worsening arc into an open latest) to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-index-trend \
            --file=docs/examples/release-decision-closeout-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-index-trend/window-watch.json \
            --strict-watch --json >/tmp/coidxtrend-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # A worsening arc (indexed → open) is a WATCH history (exit 3) for review, not a clean pass.
          set +e
          pnpm worker:release-decision-closeout-index-trend \
            --file=docs/examples/release-decision-closeout-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-index-trend/window-watch.json --json >/tmp/coidxtrend-watch.json
          code=$?
          set -e
          test "$code" -eq 3

          # A flat incomplete history, or an unreadable window → trend-incomplete (exit 2), never clean.
          set +e
          pnpm worker:release-decision-closeout-index-trend \
            --file=docs/examples/release-decision-closeout-index-trend/window-incomplete.json \
            --file=docs/examples/release-decision-closeout-index-trend/window-incomplete.json --json >/tmp/coidxtrend-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # No window supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-index-trend --json >/tmp/coidxtrend-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-index-trend
          path: indexes/closeout-index-trend.json
          if-no-files-found: error
