name: Release decision trend action plan fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 1,4,7,10 *"

# A release-governance REVIEW step, not a per-release gate: after a decision-index TREND has been summarized (one
# `pdfxyz.release-decision-trend/1` per review period), this translates that ONE content-free trend into ONE
# `pdfxyz.release-decision-action-plan/1` operator follow-up plan — a plan verdict (clear / monitor / investigate /
# block-release / invalid), an urgency, an action class, the surfaced source trend verdict / class / arc, and an ordered
# next-action checklist. It is a content-free operational follow-up plan ONLY: it is NOT a legal / compliance sign-off,
# an external approval / signature, an identity proof, a deployment authorization, a promotion ledger, an incident
# record, or an audit log, and it signs / approves / publishes / promotes / deploys / notifies / mutates NOTHING. It
# fetches nothing — it composes the trend from committed content-free fixtures so the workflow is deterministic and
# offline.

jobs:
  release-decision-action-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Summarize a decision trend, then plan the follow-up
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plan
          # Summarize a bounded history of committed content-free decision-index windows into ONE trend (a real
          # pipeline archives one `worker:release-decision-trend` summary per review period).
          pnpm worker:release-decision-trend \
            --file=docs/examples/release-decision-trend/window-stable.json \
            --file=docs/examples/release-decision-trend/window-stable.json \
            --output=plan/trend.json
          # Translate the ONE trend into a bounded operator follow-up plan.
          pnpm worker:release-decision-action-plan \
            --trend=plan/trend.json \
            --output=plan/action-plan.json
          # Render the plan into the job summary.
          pnpm worker:release-decision-action-plan \
            --trend=plan/trend.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCKED trend → block-release (exit 4) — hold promotion and reconcile before relying on the history.
          set +e
          pnpm worker:release-decision-action-plan \
            --trend=docs/examples/release-decision-action-plan/trend-blocked.json --json >/tmp/plan-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A non-trend decoy can't be trusted → invalid (exit 4), never a vacuous clear plan.
          set +e
          pnpm worker:release-decision-action-plan \
            --trend=docs/examples/release-decision-action-plan/not-a-trend.json --json >/tmp/plan-invalid.json
          code=$?
          set -e
          test "$code" -eq 4

          # A worsening (degrading) trend → a follow-up monitor plan (exit 3) for review, not a clean pass.
          set +e
          pnpm worker:release-decision-action-plan \
            --trend=docs/examples/release-decision-action-plan/trend-degrading.json --json >/tmp/plan-followup.json
          code=$?
          set -e
          test "$code" -eq 3

          # An inconclusive (insufficient) trend → investigate (exit 2), not clean.
          set +e
          pnpm worker:release-decision-action-plan \
            --trend=docs/examples/release-decision-action-plan/trend-insufficient.json --json >/tmp/plan-investigate.json
          code=$?
          set -e
          test "$code" -eq 2

          # --strict escalates any non-clear trend to block-release (exit 4).
          set +e
          pnpm worker:release-decision-action-plan \
            --trend=docs/examples/release-decision-action-plan/trend-watch.json --strict --json >/tmp/plan-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # No trend supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-action-plan --json >/tmp/plan-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-action-plan
          path: plan/action-plan.json
          if-no-files-found: error
