name: Release decision index trend fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 1 1,4,7,10 *"

# A release-governance REVIEW step, not a per-release gate: after a series of release-decision LEDGER windows has been
# indexed (one `pdfxyz.release-decision-index/1` per review period), this SUMMARIZES a bounded history of those
# content-free windows into ONE `pdfxyz.release-decision-trend/1` summary — the per-window index-verdict distribution,
# the aggregate decision distribution, a per-window posture sequence, an arc direction + trend class, a trend verdict
# (improving / stable / watch / degrading / insufficient / blocked / invalid), and a next-action checklist. It is a
# ledger-index TREND SUMMARY ONLY: it is NOT a legal audit log, a compliance attestation, an external approval /
# signature, an identity proof, or a deployment / promotion ledger, and it signs / approves / publishes / promotes /
# deploys / notifies / mutates NOTHING. It fetches nothing — it composes the history from committed content-free
# fixtures so the workflow is deterministic and offline. Direction is derived from ORDERED INPUT POSITIONS (oldest
# first, newest last), never from any ingested timestamp.

jobs:
  release-decision-trend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Index two decision windows, then summarize the trend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows
          # Compose two content-free decision-index windows from committed decision-record fixtures (a real pipeline
          # indexes one `worker:release-decision-index` window per review period and archives it).
          pnpm worker:release-decision-index \
            --file=docs/examples/release-decision-index/decision-proceed.json \
            --file=docs/examples/release-decision-index/decision-proceed.json \
            --output=windows/w1.json
          pnpm worker:release-decision-index \
            --file=docs/examples/release-decision-index/decision-proceed.json \
            --file=docs/examples/release-decision-index/decision-proceed.json \
            --output=windows/w2.json
          # Summarize the bounded history (oldest first, newest last) into ONE governance trend summary.
          pnpm worker:release-decision-trend \
            --file=windows/w1.json \
            --file=windows/w2.json \
            --output=windows/decision-trend.json
          # Render the trend into the job summary.
          pnpm worker:release-decision-trend \
            --file=windows/w1.json \
            --file=windows/w2.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCKED window in the history blocks the trend (exit 4) — do not treat the history as clean.
          set +e
          pnpm worker:release-decision-trend \
            --file=docs/examples/release-decision-trend/window-stable.json \
            --file=docs/examples/release-decision-trend/window-blocked.json --json >/tmp/trend-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A TAMPERED window can't be trusted → invalid (exit 4), never a vacuous clean pass.
          set +e
          pnpm worker:release-decision-trend \
            --file=docs/examples/release-decision-trend/window-stable.json \
            --file=docs/examples/release-decision-trend/window-tampered.json --json >/tmp/trend-invalid.json
          code=$?
          set -e
          test "$code" -eq 4

          # A worsening arc (stable → watch) is a DEGRADING history (exit 3) for review, not a clean pass.
          set +e
          pnpm worker:release-decision-trend \
            --file=docs/examples/release-decision-trend/window-stable.json \
            --file=docs/examples/release-decision-trend/window-watch.json --json >/tmp/trend-degrading.json
          code=$?
          set -e
          test "$code" -eq 3

          # An only-insufficient history is inconclusive → insufficient (exit 2), not clean.
          set +e
          pnpm worker:release-decision-trend \
            --file=docs/examples/release-decision-trend/window-insufficient.json \
            --file=docs/examples/release-decision-trend/window-insufficient.json --json >/tmp/trend-insufficient.json
          code=$?
          set -e
          test "$code" -eq 2

          # No window supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-trend --json >/tmp/trend-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-trend
          path: windows/decision-trend.json
          if-no-files-found: error
