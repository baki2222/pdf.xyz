name: Release decision closeout action-plan execution receipt fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 2,8 *"

# A release-governance REVIEW step, not a per-release gate: after a closeout-index trend has been translated into ONE
# `pdfxyz.release-decision-closeout-action-plan/1` follow-up plan (Phase 67), this records whether that plan's required
# follow-ups were acknowledged / executed — ONE `pdfxyz.release-decision-closeout-action-receipt/1` execution receipt: a
# receipt verdict (completed / incomplete / followup-open / blocked), the resolved plan class, and a bounded
# acknowledgement checklist. The acknowledgements are BOUNDED BOOLEANS an operator actually performed — never a free-form
# note or actor name. It is a content-free operational execution receipt ONLY: it is NOT a legal / compliance sign-off, an
# external approval / signature, an identity proof, a deployment authorization, a promotion ledger, an incident record, or
# an audit log, and it signs / approves / publishes / promotes / deploys / notifies / mutates NOTHING. It fetches nothing
# — it composes the plan from committed content-free fixtures so the workflow is deterministic and offline.

jobs:
  release-decision-closeout-action-receipt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Translate a closeout-index trend into a plan, then record the execution receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          # Summarize a bounded history of committed content-free closeout-index windows into ONE trend, then translate
          # that ONE trend into a follow-up plan (a real pipeline archives one plan per governance review period).
          pnpm worker:release-decision-closeout-index-trend \
            --file=docs/examples/release-decision-closeout-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-index-trend/window-indexed.json \
            --output=receipt/trend.json
          pnpm worker:release-decision-closeout-action-plan \
            --trend=receipt/trend.json \
            --output=receipt/plan.json
          # Record the execution receipt: a coherent stable plan reviewed by the operator → completed.
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=receipt/plan.json \
            --ack-plan \
            --output=receipt/closeout-action-receipt.json
          # Render the receipt into the job summary.
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=receipt/plan.json \
            --ack-plan \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCK plan not acknowledged as held-blocked → blocked (exit 4) — do NOT treat the release as closed.
          set +e
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=docs/examples/release-decision-closeout-action-receipt/plan-block.json --json >/tmp/receipt-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A tampered plan fails closed → blocked (exit 4), even fully acknowledged.
          set +e
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=docs/examples/release-decision-closeout-action-receipt/plan-tampered.json \
            --ack-plan --ack-block --ack-executed --json >/tmp/receipt-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # A missing / unreadable plan decoy also fails closed → blocked (exit 4), never a vacuous completed receipt.
          set +e
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=docs/examples/release-decision-closeout-action-receipt/not-a-plan.json --json >/tmp/receipt-unreadable.json
          code=$?
          set -e
          test "$code" -eq 4

          # A monitor plan reviewed but its follow-up not yet acknowledged → followup-open (exit 3), for review.
          set +e
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=docs/examples/release-decision-closeout-action-receipt/plan-monitor.json \
            --ack-plan --json >/tmp/receipt-followup.json
          code=$?
          set -e
          test "$code" -eq 3

          # A clear plan NOT acknowledged as reviewed → incomplete (exit 2), never a vacuous completed receipt.
          set +e
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=docs/examples/release-decision-closeout-action-receipt/plan-clear.json --json >/tmp/receipt-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # An investigate plan reviewed but its investigation not yet executed → incomplete (exit 2), a coverage gap.
          set +e
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=docs/examples/release-decision-closeout-action-receipt/plan-investigate.json \
            --ack-plan --json >/tmp/receipt-investigate.json
          code=$?
          set -e
          test "$code" -eq 2

          # --strict-open escalates an open monitor follow-up to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-action-receipt \
            --plan=docs/examples/release-decision-closeout-action-receipt/plan-monitor.json \
            --ack-plan --strict-open --json >/tmp/receipt-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # No plan supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-action-receipt --json >/tmp/receipt-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-action-receipt
          path: receipt/closeout-action-receipt.json
          if-no-files-found: error
