name: pdf.xyz worker release evidence index

# Runs the offline RELEASE EVIDENCE INDEX / RETENTION MANIFEST (Phase 48) as a pre-deploy / archival
# job: it runs the release gate, archives its result as a release evidence artifact (Phase 47), then
# INDEXES the archived artifact(s) — re-verifying each integrity digest and folding them into one
# content-free retention manifest — and uploads that manifest as a CI artifact. It makes NO cloud
# call, needs NO credentials, reads NO secret, and deletes/prunes NOTHING — every step is offline and
# deterministic (the offline gate + committed content-free fixtures). This is a TEMPLATE.
#
# The index is content-free INDEXING + digest verification, NOT storage retention ENFORCEMENT: it
# FLAGS over-retention / stale / tampered history for an operator to act on; it never prunes an
# artifact or an object, validates real cloud retention, signs, or promotes. Run your changed-file
# no-secret / no-NUL scan separately.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lib/workers/release-index/**"
      - "scripts/worker-release-index.ts"
      - ".github/workflows/**"

jobs:
  release-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1) Run the release gate and capture its content-free result.
      - name: Run the release gate
        run: pnpm -s worker:release-gate --json > gate.json || true

      # 2) Archive the gate result as a release evidence artifact (Phase 47), with a release label.
      - name: Archive the release evidence artifact
        run: pnpm -s worker:release-artifact --release-gate=gate.json --label=ci-example --output=release-artifact.json --json

      # 3) INDEX the archived artifact(s): re-verify each integrity digest and build the retention
      #    manifest. A single clean artifact with no retention bounds resolves ok (exit 0). Emit the
      #    manifest as a CI artifact / retention record.
      - name: Build + validate the release evidence index
        run: pnpm -s worker:release-index --artifact=release-artifact.json --output=release-index.json --json

      # 4) A TAMPERED artifact MUST fail digest re-verification (index → invalid, exit 4) — proves the
      #    index's digest re-verification is load-bearing.
      - name: A tampered artifact makes the index invalid (exit 4)
        run: |
          set +e
          sed 's/"schemaVersion": 1/"schemaVersion": 2/' release-artifact.json > tampered-artifact.json
          pnpm -s worker:release-index --artifact=tampered-artifact.json >/dev/null 2>&1
          code=$?
          test "$code" -eq 4 || { echo "expected 4, got $code"; exit 1; }

      # 5) A misused CLI fails closed to the distinct usage band (exit 1) — never a silent pass.
      - name: A non-numeric retention bound fails closed (exit 1)
        run: |
          set +e
          pnpm -s worker:release-index --artifact=release-artifact.json --max-artifacts=not-a-number >/dev/null 2>&1
          code=$?
          test "$code" -eq 1

      # 6) Publish the retention manifest as a CI artifact / release record.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-index
          path: release-index.json

      - name: Release-index module unit + CLI smoke tests (no-leak + digest re-verification)
        run: pnpm exec vitest run src/lib/workers/release-index
