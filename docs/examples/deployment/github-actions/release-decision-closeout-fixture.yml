name: Release decision closeout bundle fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 1,4,7,10 *"

# A release-governance REVIEW step, not a per-release gate: after a decision trend has been translated into ONE
# `pdfxyz.release-decision-action-plan/1` follow-up plan and that plan has been recorded as a
# `pdfxyz.release-decision-action-receipt/1` execution receipt, this COMPOSES the whole decision governance chain into ONE
# `pdfxyz.release-decision-closeout/1` record: a closeout verdict (closed / closeout-incomplete / closeout-open /
# closeout-blocked), the primary receipt's state + verdict, and a bounded related-record checklist. It re-validates the
# primary receipt against itself and cross-checks the supplied related records (plan / trend / decision / index) against
# what the receipt recorded. It is a content-free operational closeout SUMMARY ONLY: it is NOT a legal / compliance
# sign-off, an external approval / signature, an identity proof, a deployment authorization, a promotion ledger, an
# incident record, or an audit log, and it signs / approves / publishes / promotes / deploys / notifies / mutates NOTHING.
# It fetches nothing — it builds the chain from committed content-free fixtures so the workflow is deterministic and
# offline.

jobs:
  release-decision-closeout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the decision chain, then compose the closeout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p closeout
          # Summarize a bounded history of committed content-free decision-index windows into ONE trend, translate that
          # trend into a follow-up plan, and record the execution receipt (a clean stable plan reviewed → completed).
          pnpm worker:release-decision-trend \
            --file=docs/examples/release-decision-trend/window-stable.json \
            --file=docs/examples/release-decision-trend/window-stable.json \
            --output=closeout/trend.json
          pnpm worker:release-decision-action-plan \
            --trend=closeout/trend.json \
            --output=closeout/plan.json
          pnpm worker:release-decision-action-receipt \
            --plan=closeout/plan.json \
            --ack-plan \
            --output=closeout/receipt.json
          # Compose the closeout over the receipt cross-checked against the plan + trend it was built from → closed.
          pnpm worker:release-decision-closeout \
            --receipt=closeout/receipt.json \
            --plan=closeout/plan.json \
            --trend=closeout/trend.json \
            --output=closeout/closeout.json
          # Render the closeout into the job summary.
          pnpm worker:release-decision-closeout \
            --receipt=closeout/receipt.json \
            --plan=closeout/plan.json \
            --trend=closeout/trend.json \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A block-class receipt (its plan not acknowledged as held-blocked) → closeout-blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-blocked.json --json >/tmp/closeout-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A tampered primary receipt fails closed → closeout-blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-tampered.json --json >/tmp/closeout-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # A supplied plan that does NOT match the receipt (a cross-check mismatch) → closeout-blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-completed.json \
            --plan=docs/examples/release-decision-closeout/plan-contradictory.json --json >/tmp/closeout-contradiction.json
          code=$?
          set -e
          test "$code" -eq 4

          # A followup-open receipt (an open advisory follow-up upstream) → closeout-open (exit 3), for review.
          set +e
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-followup-open.json --json >/tmp/closeout-open.json
          code=$?
          set -e
          test "$code" -eq 3

          # A receipt NOT acknowledged as reviewed (an incomplete receipt) → closeout-incomplete (exit 2).
          set +e
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-incomplete.json --json >/tmp/closeout-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # --strict-open escalates an open closeout to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout \
            --receipt=docs/examples/release-decision-closeout/receipt-followup-open.json \
            --strict-open --json >/tmp/closeout-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # No primary receipt supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout --json >/tmp/closeout-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout
          path: closeout/closeout.json
          if-no-files-found: error
