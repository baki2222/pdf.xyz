name: Release decision closeout governance finalize index trend finalize index trend closeout index trend action-plan execution receipt fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 3,9 *"

# A release-governance REVIEW step, not a per-release gate: after a closeout-index trend has been translated into ONE
# `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-plan/1`
# follow-up plan (Phase 92), this records whether the operator provided the bounded acknowledgements required to close it
# out or hold it — ONE
# `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/1`
# execution receipt: a receipt verdict (completed / incomplete / followup-open / blocked / invalid), the resolved plan
# class, and a bounded acknowledgement checklist. The acknowledgements are BOUNDED BOOLEANS an operator actually performed
# — never a free-form note or actor name. It is a content-free operational acknowledgement receipt ONLY: it is NOT a legal
# / compliance sign-off, an external approval / signature, an identity proof, a deployment authorization, a promotion
# ledger, an incident record, or an audit log, and it signs / approves / publishes / promotes / deploys / notifies /
# mutates NOTHING — even a completed block plan records the release as HELD, never promoted. It fetches nothing — it
# composes the plan from committed content-free fixtures so the workflow is deterministic and offline.

jobs:
  release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Translate a closeout-index trend into a plan, then record the execution receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          # Summarize a bounded history of committed content-free closeout-index windows into ONE trend, then translate
          # that ONE trend into a follow-up plan (a real pipeline archives one plan per review period).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend \
            --file=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend/window-indexed.json \
            --file=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend/window-indexed.json \
            --output=receipt/trend.json
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-plan \
            --trend=receipt/trend.json \
            --output=receipt/plan.json
          # Record the execution receipt: a coherent stable (clear) plan reviewed + accepted by the operator → completed (exit 0).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=receipt/plan.json \
            --ack-plan --ack-clear \
            --output=receipt/closeout-index-trend-action-receipt.json
          # Render the receipt into the job summary.
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=receipt/plan.json \
            --ack-reviewed --ack-clear \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        run: |
          # A BLOCK plan is blocked (exit 4) when the operator has NOT confirmed the release remains held (--ack-block absent).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-block.json \
            --json >/tmp/creceipt-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A fully-acknowledged BLOCK plan is completed (exit 0) — but the release remains HELD, never promoted.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-block.json \
            --ack-plan --ack-block --json >/tmp/creceipt-block-held.json
          code=$?
          set -e
          test "$code" -eq 0

          # A plan whose own verdict is invalid is a BLOCK-class hold → blocked (exit 4) until acknowledged as held.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-invalid.json \
            --json >/tmp/creceipt-invalid-hold.json
          code=$?
          set -e
          test "$code" -eq 4

          # A tampered plan fails closed → invalid (exit 4), even fully acknowledged.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-tampered.json \
            --ack-plan --ack-monitor --json >/tmp/creceipt-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # A missing / unreadable plan decoy also fails closed → invalid (exit 4), never a vacuous completed receipt.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/not-a-plan.json --json >/tmp/creceipt-unreadable.json
          code=$?
          set -e
          test "$code" -eq 4

          # A monitor plan reviewed but its follow-up not yet acknowledged → followup-open (exit 3), for review.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-monitor.json \
            --ack-plan --json >/tmp/creceipt-followup-open.json
          code=$?
          set -e
          test "$code" -eq 3

          # A clear plan reviewed but NOT accepted for routine monitoring → incomplete (exit 2), never a vacuous completed receipt.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-clear.json \
            --ack-plan --json >/tmp/creceipt-unaccepted.json
          code=$?
          set -e
          test "$code" -eq 2

          # --strict-open escalates an open follow-up to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-monitor.json \
            --ack-plan --strict-open --json >/tmp/creceipt-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # A contradictory acknowledgement (ack-block on a clear plan) → blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-clear.json \
            --ack-plan --ack-clear --ack-block --json >/tmp/creceipt-contradiction.json
          code=$?
          set -e
          test "$code" -eq 4

          # A clear plan reviewed + accepted → completed (exit 0), the closed-out happy path.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt \
            --plan=docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt/plan-clear.json \
            --ack-plan --ack-clear --json >/tmp/creceipt-completed.json
          code=$?
          set -e
          test "$code" -eq 0

          # No plan supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt --json >/tmp/creceipt-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout-index-trend-closeout-index-trend-action-receipt
          path: receipt/closeout-index-trend-action-receipt.json
          if-no-files-found: error
