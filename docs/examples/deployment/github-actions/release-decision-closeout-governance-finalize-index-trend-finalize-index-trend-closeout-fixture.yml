name: Release decision closeout governance finalize index trend finalize index trend closeout bundle fixture

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 3,9 *"

# A release-governance REVIEW step, not a per-release gate: after a finalize-index-trend-finalize-index-trend follow-up
# plan has been recorded as ONE `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-action-receipt/1`
# execution receipt (Phase 83), this COMPOSES that receipt plus the OPTIONAL related records already on hand (the
# `…-action-plan/1` plan, the `…-finalize-index-trend/1` trend, and the `…-finalize-index/1` finalization-index window)
# into ONE `pdfxyz.release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout/1` closeout
# bundle: a closeout verdict (closed / open / incomplete / blocked / invalid), a bounded primary-receipt summary, a
# bounded related-record checklist, a bounded source-chain posture, and a content-free receipt. It re-validates the
# primary receipt against itself and cross-checks the supplied related records; a tampered receipt, a contradictory
# related record, or a blocked source chain fails closed. It is a content-free operational closeout SUMMARY ONLY: it is
# NOT a legal / compliance sign-off, an external approval / signature, an identity proof, a deployment authorization, a
# promotion ledger, an incident record, or an audit log, and it archives / approves / signs / publishes / promotes /
# deploys / notifies / mutates NOTHING. It fetches nothing — it composes committed content-free fixtures so the workflow
# is deterministic and offline.

jobs:
  release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Close out a completed finalize-index-trend-finalize-index-trend receipt with coherent related records
        shell: bash
        env:
          EX: docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout
        run: |
          set -euo pipefail
          mkdir -p closeout
          # A completed receipt with the coherent plan / trend / finalization-index window it was built from → closed (exit 0).
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-completed.json" \
            --plan="$EX/plan-coherent.json" \
            --trend="$EX/trend-coherent.json" \
            --index="$EX/index-coherent.json" \
            --output=closeout/finalize-index-trend-finalize-index-trend-closeout.json
          # Render the closeout into the job summary.
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --file="$EX/receipt-completed.json" \
            --index="$EX/index-coherent.json" \
            --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed examples
        shell: bash
        env:
          EX: docs/examples/release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout
        run: |
          # A completed receipt alone → closed (exit 0), the happy path.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-completed.json" --json >/tmp/fc-closed.json
          code=$?
          set -e
          test "$code" -eq 0

          # A contradictory plan (not the one the receipt receipted) fails closed → blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-completed.json" --plan="$EX/plan-contradictory.json" --json >/tmp/fc-contradiction.json
          code=$?
          set -e
          test "$code" -eq 4

          # A blocked finalization-index window upstream fails closed → blocked (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-completed.json" --index="$EX/index-blocked.json" --json >/tmp/fc-source-blocked.json
          code=$?
          set -e
          test "$code" -eq 4

          # A followup-open receipt → open (exit 3), for review.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-followup-open.json" --json >/tmp/fc-open.json
          code=$?
          set -e
          test "$code" -eq 3

          # --strict-open escalates an open closeout to a hard block (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-followup-open.json" --strict-open --json >/tmp/fc-strict.json
          code=$?
          set -e
          test "$code" -eq 4

          # An incomplete receipt → incomplete (exit 2), a coverage gap.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-incomplete.json" --json >/tmp/fc-incomplete.json
          code=$?
          set -e
          test "$code" -eq 2

          # A required-but-absent related record → incomplete (exit 2), never a vacuous closed closeout.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-completed.json" --require-plan --json >/tmp/fc-required-missing.json
          code=$?
          set -e
          test "$code" -eq 2

          # A tampered receipt document fails closed → invalid (exit 4).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/receipt-tampered.json" --json >/tmp/fc-tampered.json
          code=$?
          set -e
          test "$code" -eq 4

          # A missing / unreadable receipt decoy also fails closed → invalid (exit 4), never a vacuous closed closeout.
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout \
            --receipt="$EX/not-a-receipt.json" --json >/tmp/fc-unreadable.json
          code=$?
          set -e
          test "$code" -eq 4

          # No receipt supplied is a usage error (exit 1).
          set +e
          pnpm worker:release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout --json >/tmp/fc-usage.json
          code=$?
          set -e
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-decision-closeout-governance-finalize-index-trend-finalize-index-trend-closeout
          path: closeout/finalize-index-trend-finalize-index-trend-closeout.json
          if-no-files-found: error
