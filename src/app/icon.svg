<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pdf.xyz">
  <!--
    The registration mark, not a document glyph.

    The header wordmark (src/components/layout/logo.tsx) retired the violet
    gradient tile with a page icon on purpose — its own docblock calls that
    "everyone's mark". This file and the share cards kept rendering it anyway,
    so until 2026-09-20 the browser tab, the installed icon and every social
    preview showed an identity the site itself had stopped using.

    Ground is ink (--sf-invert), the square is the accent at its dark-scheme
    value because it sits on ink, and the corner ticks are the trim marks the
    prepress system is named for. Colours are literals here because an SVG
    cannot read the stylesheet; theme-palette-copies.test.ts binds them.
  -->
  <rect width="512" height="512" rx="116" fill="#10151a"/>
  <g stroke="#53c1ee" stroke-width="18" fill="none" stroke-linecap="square">
    <path d="M104 104 H160 M104 104 V160"/>
    <path d="M408 104 H352 M408 104 V160"/>
    <path d="M104 408 H160 M104 408 V352"/>
    <path d="M408 408 H352 M408 408 V352"/>
  </g>
  <rect x="196" y="196" width="120" height="120" fill="#53c1ee"/>
</svg>
